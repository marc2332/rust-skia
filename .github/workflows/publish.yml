name: Cargo Publish

on:
  workflow_dispatch:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    container: ghcr.io/pragmatrix/rust-skia-linux:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fix git dubious ownership errors when synchronizing Skia dependencies
        run: git config --global --add safe.directory '*'

      - name: Prepare Rustup
        run: (cd /github/home && ln -s /root/.cargo)

      - name: Update Rustup and Rust
        run: rustup update

      - name: Configure Rust Toolchain
        run: rustup default stable

      - name: Publish freya-skia-svg-macros
        run: make publish-svg-macros
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # `publish-bindings-docs` generates `bindings_docs.rs` via `make
      # bindings-docs`, copies it into the skia-bindings crate, and then runs
      # `cargo publish --no-verify --allow-dirty`. Without that file in the
      # tarball, every downstream docs.rs build fails (rust-skia#720).
      - name: Publish freya-skia-bindings
        run: make publish-bindings-docs
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish freya-skia-safe
        run: make publish-safe
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
